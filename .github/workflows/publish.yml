# Build sdist + arm64 wheel on Apple Silicon, upload to PyPI.
# Configure either:
#   - PyPI "Trusted Publishing" for this repo + workflow (OIDC, no token), or
#   - Repository secret PYPI_API_TOKEN (classic API token) and uncomment the `with:` block below.
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build
        run: pip install --upgrade pip build

      - name: Build sdist and wheel
        env:
          MCCL_REQUIRE_METALLIB: "1"
        run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # gh-action-pypi-publish only runs on Linux. Uses repo secret PYPI_API_TOKEN.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
