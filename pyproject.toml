[build-system]
# _C links against libtorch, and WorkMCCL derives from c10d::Work, so the vtable picks up
# whatever virtuals the build-time torch declares. Building in pip's isolated env against a
# different torch than the install target yields a wheel that cannot dlopen
# (Symbol not found: c10d::Work::getTimeout). Prefer `pip install --no-build-isolation` so the
# build sees the installed torch; this range only bounds the isolated-build fallback.
requires = [
    "setuptools>=68.0",
    "wheel>=0.41",
    "torch>=2.13,<2.15",
]
build-backend = "setuptools.build_meta"

[project]
name = "mccl"
version = "6.7.0"
description = "MPS-native ProcessGroup backend for PyTorch Distributed on Apple Silicon"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
# CI installs torch from the PyTorch nightly index (see .github/workflows/ci.yml) to track MPS / distributed churn.
dependencies = [
    "numpy>=1.20",
    "torch>=2.5.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
[project.urls]
Repository = "https://github.com/mps-ddp/mccl"


[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-timeout>=2.1",
]

[tool.setuptools.packages.find]
include = ["mccl*"]

[tool.pytest.ini_options]
addopts = "--tb=short --capture=no --log-cli-level=WARNING"
log_file = "test_failures.log"
log_file_level = "DEBUG"
markers = [
    "timeout: Max seconds for this test (enforced by pytest-timeout; install dev extra).",
    "slow: Long-running or redundant tests skipped in default CI (run nightly or with -m slow).",
]
