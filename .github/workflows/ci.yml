# MCCL only builds on macOS Apple Silicon. Hosted macos-14+ runners are arm64 (M-series).
#
# Push/PR: build + one DDP backward smoke. The rest of tests/ is local.
name: CI

on:
  push:
    branches: [main, master, "perf/**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/ci.yml

      - name: Install dependencies
        env:
          MCCL_REQUIRE_METALLIB: "1"
        run: |
          python -m pip install --upgrade pip
          pip install numpy "pytest>=7.0" "pytest-timeout>=2.1" "setuptools>=68.0" "wheel>=0.41"
          pip install torch==2.14.0
          pip install -e . --no-deps --no-build-isolation

      - name: Build and 2-worker DDP smoke
        run: |
          pytest -v --timeout=180 tests/test_build.py
          pytest -v --timeout=180 tests/test_mccl_ddp_backward_smoke.py -k "float32-2"
